<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Контроль банковских данных</title>
    <link rel="stylesheet" href="/css/main.css">
    <script src="/js/user-settings.js" defer></script>
    <script src="/js/admin.js" defer></script>
</head>
<body class="page">
<header class="page-header">
    <div class="header-top">
        <h1 class="page-title">Контроль банковских данных</h1>
        <div th:replace="~{fragments/user-actions :: userActions(${isAdministrator}, ${databaseLocked})}"></div>
    </div>
    <nav class="section-nav">
        <a class="section-button" href="/bankrecall">Отзыв в банк</a>
        <a class="section-button" href="/sedrecall">Отзывы в СЭД</a>
        <a class="section-button" href="/manualwork">Ручной режим</a>
    </nav>
</header>

<main class="main-content">
    <p class="status-message" th:if="${param.databaseLocked}">Изменение данных временно заблокировано администратором.</p>
    <section class="table-area">
        <p class="table-placeholder">Выберите журнал для работы</p>
    </section>
</main>
</body>
</html>
