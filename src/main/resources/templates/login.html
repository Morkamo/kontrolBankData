<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" href="/css/main.css">
    <script src="/js/user-settings.js" defer></script>
</head>
<body class="page login-page">
<main class="login-shell">
    <section class="login-card">
        <h1 class="login-title">Вход</h1>
        <p class="login-error" th:if="${sessionMessage}" th:text="${sessionMessage}"></p>

        <form class="login-form" action="/login" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label class="form-field">
                Логин
                <input class="field-input" type="text" name="username" maxlength="40" required autofocus>
            </label>

            <label class="form-field">
                Пароль
                <input class="field-input" type="password" name="password" maxlength="8" required>
            </label>

            <button class="button button-primary" type="submit">Войти</button>
            <p class="login-error" th:if="${error}" th:text="${error}"></p>
        </form>
    </section>
</main>
</body>
</html>
